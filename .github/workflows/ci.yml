name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
      JWT_SECRET: test-only-secret-with-more-than-32-characters
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-password-with-more-than-14-characters
      SITE_HTTP_ALLOW_LOCALHOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security report
        run: npm audit --json > npm-audit.json || true
      - name: Summarize dependency advisories
        run: |
          node -e 'const r=require("./npm-audit.json"); console.log("Vulnerability totals:", JSON.stringify(r.metadata?.vulnerabilities)); for (const [n,v] of Object.entries(r.vulnerabilities || {})) console.log(n + ": " + v.severity + ", direct=" + v.isDirect + ", fix=" + JSON.stringify(v.fixAvailable));'
      - name: Enforce dependency security threshold
        run: node scripts/check-audit.mjs
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build
      - name: Build Docker image
        run: docker build -t developersia-ai:ci .
      - run: node scripts/runtime-smoke.mjs
      - run: npm test
      - name: PHP syntax check
        run: php -l plugins/developersia-ai/developersia-ai.php
      - name: Package WordPress plugin
        run: |
          cd plugins
          zip -r ../developersia-ai-connector.zip developersia-ai
      - uses: actions/upload-artifact@v4
        with:
          name: developersia-ai-wordpress-plugin
          path: developersia-ai-connector.zip
          if-no-files-found: error
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
